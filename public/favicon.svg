  <!-- The zeepler mark, copied from zeepler's public/favicon.svg. src/brand/zeepler-mark.svg and
       .github/assets/zeepler-mark-*.svg draw the same mark; change them together.
       Inverted on a dark browser tab by the media query below. -->
  <style>
    .ink { fill: #0b1f33; } .ink-line { stroke: #0b1f33; }
    .accent { fill: #047857; } .accent-line { stroke: #047857; }
    .paper { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f6f7f9; } .ink-line { stroke: #f6f7f9; }
      .accent { fill: #10b981; } .accent-line { stroke: #10b981; }
      .paper { fill: #202124; }
    }
  </style>
  <rect class="paper ink-line" x="11" y="10" width="26" height="34" rx="1.5" stroke-width="3"/>
  <rect class="ink" x="4" y="4" width="40" height="9" rx="2.5"/>
